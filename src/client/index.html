<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#0b0d1f" />
	<title>Loup-Garou · Maître du jeu</title>
	<link rel="icon" href="cards/loup-garou.webp" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" />
	<style>
		/* Ambiance : nuit d'encre, or des cadres de cartes, trois couleurs de camp. */
		:root {
			color-scheme: dark;
			--bg: #0b0d1f;
			--surface: #151833;
			--surface-2: #1f2347;
			--line: rgba(214, 196, 255, .14);
			--ink: #ece6f5;
			--muted: #a59fbe;
			--gold: #d4a63f;
			--gold-light: #f2cf74;
			--gold-glow: rgba(242, 207, 116, .45);
			--ink-on-gold: #261804;
			--village: #3f8a5b;
			--village-light: #8fd3a5;
			--loups: #a8282b;
			--loups-light: #ff8a7a;
			--solitaire: #7446b8;
			--solitaire-light: #c8a6ff;
			--font-display: "Grenze Gotisch", "Palatino Linotype", Georgia, serif;
			--font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
		}

		html, body {
			min-height: 100%;
		}

		body {
			margin: 0;
			background: var(--bg);
			color: var(--ink);
			font-family: var(--font-body);
			font-size: 16px;
			line-height: 1.5;
			-webkit-font-smoothing: antialiased;
		}

		body::before {
			content: "";
			position: fixed;
			inset: 0;
			z-index: -1;
			pointer-events: none;
			transition: opacity 1.2s ease;
			background:
				radial-gradient(1.5px 1.5px at 12% 18%, #fff8 50%, transparent 51%),
				radial-gradient(1px 1px at 72% 12%, #fff9 50%, transparent 51%),
				radial-gradient(1.5px 1.5px at 40% 30%, #fff6 50%, transparent 51%),
				radial-gradient(1px 1px at 88% 40%, #fff8 50%, transparent 51%),
				radial-gradient(1px 1px at 22% 55%, #fff5 50%, transparent 51%),
				radial-gradient(1.5px 1.5px at 60% 62%, #fff4 50%, transparent 51%),
				radial-gradient(circle at 88% 22%, #f6efd6cc 0 22px, #f6efd61a 24px, transparent 90px),
				linear-gradient(180deg, #13163a 0%, #0b0d1f 60%);
		}

		body[data-phase="premier-matin"]::before,
		body[data-phase="matin"]::before {
			background:
				radial-gradient(circle at 50% 108%, #ffcf7a 0 50px, #ff9d5c40 110px, transparent 300px),
				linear-gradient(180deg, #161c40 0%, #2c2c5c 50%, #5a3f5e 85%, #7c4f50 100%);
		}

		body[data-phase="soir"]::before {
			background:
				radial-gradient(circle at 20% 98%, #ff7a4a 0 34px, #ff5a3c33 100px, transparent 280px),
				linear-gradient(180deg, #140f33 0%, #2c1840 55%, #55233a 100%);
		}

		lg-app {
			display: block;
			min-height: 100vh;
		}
	</style>
	<script type="module" src="./main.ts"></script>
</head>
<body>
	<lg-app></lg-app>
</body>
</html>
